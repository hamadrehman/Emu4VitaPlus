name: Build Emu4VitaPlus Boot URI VPK

on:
  workflow_dispatch:
  push:
    branches:
      - td/boot-uri-retroflow-launch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl py3-lz4 py3-openpyxl unzip zip git g++ file binutils make
          else
            apt-get update
            apt-get install -y curl python3-lz4 python3-openpyxl unzip zip git g++ file binutils make
          fi

      - name: Install VitaSDK packages
        run: |
          vdpm update
          vdpm install -f libjpeg-turbo imgui-vita2d

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive
          git submodule update --init --recursive \
            deps/simpleini \
            deps/minizip-ng \
            deps/7-Zip \
            deps/libretro-common \
            deps/lz4 \
            deps/rcheevos \
            cores/libretro-fba-lite \
            cores/Genesis-Plus-GX \
            cores/picodrive \
            cores/snes9x \
            cores/snes9x2005 \
            cores/chimerasnes

      - name: Fetch upstream release VPK
        run: |
          mkdir -p release
          curl -L --fail --retry 3 \
            -o release/Emu4VitaPlus_v0.68.vpk \
            https://github.com/noword/Emu4VitaPlus/releases/download/v0.68/Emu4VitaPlus_v0.68.vpk

      - name: Build patched VPK
        run: |
          chmod +x scripts/build_boot_uri_vpk.sh
          scripts/build_boot_uri_vpk.sh

      - name: Rebuild patched standalone cores
        run: |
          chmod +x scripts/rebuild_release_cores.sh
          scripts/rebuild_release_cores.sh

      - name: Generate checksums
        run: |
          cd out
          sha256sum Emu4VitaPlus_v0.68_boot-uri.vpk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Emu4VitaPlus boot-uri build ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            Automated build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Assets:
            - `Emu4VitaPlus_v0.68_boot-uri.vpk`
            - `SHA256SUMS.txt`
          files: |
            out/Emu4VitaPlus_v0.68_boot-uri.vpk
            out/SHA256SUMS.txt
