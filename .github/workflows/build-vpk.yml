name: Build Emu4VitaPlus Boot URI VPK

on:
  workflow_dispatch:
  push:
    branches:
      - td/boot-uri-retroflow-launch

permissions:
  contents: write

env:
  R2_PUBLIC_BASE: https://pub-130a2a321e314a818868d6b171b3da8b.r2.dev

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl py3-lz4 py3-openpyxl unzip zip git
          else
            apt-get update
            apt-get install -y curl python3-lz4 python3-openpyxl unzip zip git
          fi

      - name: Install VitaSDK packages
        run: |
          vdpm update
          vdpm install -f libjpeg-turbo imgui-vita2d

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive
          git submodule update --init \
            deps/simpleini \
            deps/minizip-ng \
            deps/7-Zip \
            deps/libretro-common \
            deps/lz4 \
            deps/rcheevos

      - name: Fetch upstream release VPK
        run: |
          mkdir -p release
          curl -L --fail --retry 3 \
            -o release/Emu4VitaPlus_v0.68.vpk \
            https://github.com/noword/Emu4VitaPlus/releases/download/v0.68/Emu4VitaPlus_v0.68.vpk

      - name: Build patched VPK
        run: |
          chmod +x scripts/build_boot_uri_vpk.sh
          scripts/build_boot_uri_vpk.sh

      - name: Generate checksums
        run: |
          cd out
          sha256sum Emu4VitaPlus_v0.68_boot-uri.vpk > SHA256SUMS.txt

      - name: Upload mirror to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          curl --fail -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${CLOUDFLARE_R2_BUCKET}/objects/Emu4VitaPlus_v0.68_boot-uri.vpk" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-binary @out/Emu4VitaPlus_v0.68_boot-uri.vpk
          curl --fail -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${CLOUDFLARE_R2_BUCKET}/objects/Emu4VitaPlus_SHA256SUMS.txt" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-binary @out/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Emu4VitaPlus boot-uri build ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            Automated build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Assets:
            - `Emu4VitaPlus_v0.68_boot-uri.vpk`
            - `SHA256SUMS.txt`
            
            R2 mirror:
            - `${{ env.R2_PUBLIC_BASE }}/Emu4VitaPlus_v0.68_boot-uri.vpk`
            - `${{ env.R2_PUBLIC_BASE }}/Emu4VitaPlus_SHA256SUMS.txt`
          files: |
            out/Emu4VitaPlus_v0.68_boot-uri.vpk
            out/SHA256SUMS.txt
